<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>MAD STEEZ rider pose checks</title>
    <style>
      body {
        margin: 0;
        background: #253746;
        color: white;
        font: 14px Arial;
      }
      nav {
        position: absolute;
        z-index: 1;
        padding: 18px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      button {
        padding: 10px;
        background: #e0ef61;
        border: 0;
        cursor: pointer;
      }
      #readout {
        position: absolute;
        bottom: 20px;
        left: 20px;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <nav>
      <button data-pose="neutral">Neutral</button
      ><button data-pose="left">Carve left</button
      ><button data-pose="right">Carve right</button
      ><button data-pose="tuck">Tuck</button
      ><button data-pose="skate">Skate + double pole</button
      ><button data-pose="charge">Charge</button
      ><button data-pose="takeoff">Takeoff</button
      ><button data-pose="air">Airborne</button
      ><button data-pose="landing">Landing</button
      ><button data-pose="landing-hard">Hard landing</button
      ><button data-pose="skid-left">Skid left</button
      ><button data-pose="skid-right">Skid right</button
      ><button data-pose="landing-replay">Replay landing + skid</button
      ><button data-pose="mute">Mute grab</button
      ><button data-pose="daffy">Daffy</button
      ><button data-pose="hangout">Hang Out</button
      ><button data-pose="hangout-backflip">Hang Out backflip</button
      ><button data-pose="bow">Bow and Arrow</button
      ><button data-pose="japan">Japan grab</button
      ><button data-pose="octo">Octo grab</button
      ><button data-pose="blunt">Blunt grab</button
      ><button data-pose="tail">Tail grab</button
      ><button id="stance-toggle">Toggle switch</button
      ><button id="view">Rotate view</button>
      <button data-angle="3.141593">Front</button>
      <button data-angle="1.570796">Side</button>
      <button data-angle="0">Rear</button>
      <button id="sequence">Play transitions</button>
      <button data-pose="back-left">↓ + ← Cork</button>
      <button data-pose="back-right">↓ + → Cork</button>
      <button data-pose="front-left">↑ + ← Cork</button>
      <button data-pose="front-right">↑ + → Cork</button>
      <button data-pose="backflip">Backflip</button>
      <button data-pose="frontflip">Frontflip</button>
      <button id="rotation-pause">Pause / play rotation</button>
      <label>Rotation <input id="rotation-phase" type="range" min="0" max="1" step="0.01" value="0"></label>
    </nav>
    <div id="readout"></div>
    <script type="module" src="./rider-lab.js"></script>
  </body>
</html>
